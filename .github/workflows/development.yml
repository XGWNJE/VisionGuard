name: Development checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            receiver/web/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix receiver/web ci
      - name: Account isolation and relay contracts
        run: npm --prefix server test
      - name: Web session and display contracts
        run: npm --prefix receiver/web test
      - name: Build service and console
        run: npm --prefix server run build
      - name: Naming, documentation and scripts
        run: |
          node scripts/check-docs.js
          node --test scripts/check-docs.test.js scripts/check-powershell-encoding.test.js scripts/release-workflow.test.js scripts/provision-account.test.js

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [detector/android, receiver/android, notifier/android]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Unit tests, lint and installable debug build
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build both inference runtimes and unified Windows output
        shell: powershell
        run: ./.agents/skills/visionguard-build/scripts/build-all.ps1 -Target Windows
      - name: Account and media transport contracts
        shell: powershell
        run: dotnet run --project tests/AccountMedia.Probe/AccountMedia.Probe.csproj -c Release
