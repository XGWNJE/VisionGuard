name: Documentation audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 每周一 03:17 UTC（北京时间 11:17）校验公开服务与仓库发布元数据是否仍一致。
    - cron: '17 3 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit component naming and canonical documentation
        run: node scripts/check-docs.js

      - name: Audit protocol version declarations and the version gate
        run: node scripts/check-protocol-declarations.js

      - name: Check guardrail health (broken references, disabled steps, weak assertions)
        run: node scripts/scan-guardrails.js --check

      - name: Test documentation guardrails
        run: node --test scripts/check-docs.test.js scripts/release-workflow.test.js scripts/release-notes.test.js scripts/version-sync.test.js scripts/project-guards.test.js scripts/online-release-contract.test.js scripts/check-protocol-declarations.test.js scripts/check-apk-protocol-version.test.js scripts/scan-guardrails.test.js

  online-release-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify public release contract
        run: node scripts/check-online-release-contract.js
