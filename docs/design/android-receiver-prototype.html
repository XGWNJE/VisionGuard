<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VisionGuard Receiver - Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-root: #08080c;
  --bg-surface: #111117;
  --bg-elevated: #181820;
  --bg-overlay: #1c1c26;
  --border-subtle: rgba(255,255,255,0.05);
  --border-mid: rgba(255,255,255,0.08);
  --text-primary: #e6e6ec;
  --text-secondary: #8c8c9a;
  --text-muted: #545463;
  --accent-red: #ef4444;
  --accent-red-dim: rgba(239,68,68,0.12);
  --accent-green: #22c55e;
  --accent-green-dim: rgba(34,197,94,0.10);
  --accent-amber: #f59e0b;
  --accent-amber-dim: rgba(245,158,11,0.10);
  --font-mono: 'DM Mono', 'Courier New', monospace;
  --font-sans: 'DM Sans', -apple-system, sans-serif;
}

body {
  background: var(--bg-root);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.phone-frame {
  width: 390px;
  height: min(844px, 100dvh);
  background: var(--bg-root);
  border: 1px solid var(--border-mid);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 40px 80px rgba(0,0,0,0.6);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  flex-shrink: 0;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); display: inline-block; }

.conn-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 24px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-subtle);
}
.conn-bar.online .conn-dot { background: var(--accent-green); }
.conn-bar.offline .conn-dot { background: var(--accent-red); }
.conn-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.tab-bar {
  display: flex;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 0 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s;
  letter-spacing: 0.3px;
  border: none; background: none;
  position: relative;
}
.tab.active { color: var(--text-primary); }
.tab-icon { font-size: 18px; line-height: 1; }
.tab-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 16px);
  min-width: 16px; height: 16px;
  border-radius: 8px;
  background: var(--accent-red);
  color: #fff;
  font-size: 9px;
  font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.content::-webkit-scrollbar { display: none; }

.page { display: none; flex-direction: column; min-height: 100%; }
.page.active { display: flex; }

.section-header {
  padding: 16px 20px 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.15s;
}
.alert-item:active { background: var(--bg-elevated); }
.alert-item .severity-line {
  width: 3px; min-height: 48px; border-radius: 2px;
  flex-shrink: 0; margin-top: 2px;
}
.alert-item .severity-line.critical { background: var(--accent-red); }
.alert-item .severity-line.warning { background: var(--accent-amber); }
.alert-item .severity-line.info { background: var(--text-muted); }
.alert-item .alert-body { flex: 1; min-width: 0; }
.alert-item .alert-device { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; letter-spacing: -0.2px; }
.alert-item .alert-labels { font-size: 12px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.alert-item .alert-label-tag { padding: 1px 6px; border-radius: 3px; font-family: var(--font-mono); font-size: 10px; background: var(--accent-red-dim); color: var(--accent-red); }
.alert-item .alert-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.alert-item .alert-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; margin-top: 10px; }

.page-title { padding: 20px 20px 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 4px; }
.empty-state .empty-label { font-size: 13px; font-family: var(--font-mono); }

.device-item { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
.device-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.device-status.online { background: var(--accent-green); box-shadow: 0 0 6px rgba(34,197,94,0.4); }
.device-status.offline { background: var(--text-muted); }
.device-info { flex: 1; min-width: 0; }
.device-name { font-size: 14px; font-weight: 600; margin-bottom: 1px; }
.device-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); display: flex; gap: 12px; }
.device-controls { display: flex; gap: 6px; flex-shrink: 0; }
.ctrl-btn { padding: 6px 14px; border-radius: 6px; font-family: var(--font-mono); font-size: 10px; background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-mid); cursor: pointer; transition: all 0.15s; }
.ctrl-btn:active { background: var(--bg-overlay); color: var(--text-primary); }
.ctrl-btn.danger { color: var(--accent-red); border-color: rgba(239,68,68,0.2); }
.ctrl-btn.danger:active { background: var(--accent-red-dim); }

.settings-group { padding: 0 20px 16px; border-bottom: 1px solid var(--border-subtle); }
.settings-group:last-child { border-bottom: none; }
.settings-group-title { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; padding: 20px 0 8px; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; gap: 12px; }
.settings-row .label { font-size: 14px; color: var(--text-primary); }
.settings-row .value { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
.settings-row .value.mono-block { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--bg-elevated); border: 1px solid var(--border-mid); }
.settings-btn { padding: 8px 20px; border-radius: 7px; font-family: var(--font-mono); font-size: 11px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-mid); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.settings-btn:active { background: var(--bg-overlay); }
.settings-btn.primary { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
.settings-btn.primary:active { filter: brightness(1.1); }

.detail-back { display: flex; align-items: center; gap: 4px; padding: 12px 16px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); cursor: pointer; background: none; border: none; }
.detail-header { padding: 4px 20px 16px; }
.detail-device { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.detail-timestamp { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.detail-screenshot { width: 100%; aspect-ratio: 16/10; background: var(--bg-surface); position: relative; overflow: hidden; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
.detail-screenshot .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }
.fake-scene { width: 100%; height: 100%; position: relative; background: linear-gradient(180deg, #1e1e2a 0%, #14141c 100%); }
.fake-scene .scene-figure { position: absolute; bottom: 30%; left: 35%; width: 24px; height: 56px; background: rgba(239,68,68,0.15); border-radius: 4px; }
.fake-scene .scene-object { position: absolute; bottom: 45%; right: 20%; width: 18px; height: 14px; background: rgba(245,158,11,0.12); border-radius: 2px; }
.detection-overlay { position: absolute; border: 1.5px solid var(--accent-red); border-radius: 3px; box-shadow: 0 0 8px rgba(239,68,68,0.2); }
.detection-overlay .det-label { position: absolute; top: -22px; left: -1.5px; background: rgba(239,68,68,0.9); color: #fff; font-family: var(--font-mono); font-size: 9px; padding: 2px 6px; border-radius: 2px; white-space: nowrap; }

.detail-section { padding: 20px; }
.detail-section-title { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
.detection-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.detection-row:last-child { border-bottom: none; }
.detection-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-red); flex-shrink: 0; }
.detection-name { font-size: 13px; flex: 1; }
.detection-conf { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--accent-red); }

.timing-bar { height: 4px; border-radius: 2px; background: var(--bg-elevated); overflow: hidden; position: relative; margin-top: 6px; }
.timing-bar .fill-local { position: absolute; left: 0; top: 0; height: 100%; background: var(--text-muted); border-radius: 2px; }
.timing-bar .fill-network { position: absolute; top: 0; height: 100%; background: var(--accent-amber); border-radius: 2px; }
.timing-bar .fill-server { position: absolute; top: 0; height: 100%; background: var(--text-muted); border-radius: 2px; }
.timing-legend { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.timing-legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.timing-legend-item .swatch { width: 8px; height: 8px; border-radius: 2px; }
.swatch-local { background: var(--text-muted); }
.swatch-network { background: var(--accent-amber); }
.swatch-server { background: var(--text-muted); }

.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: flex-end; }
.modal-backdrop.show { display: flex; }
.modal-sheet { width: 100%; max-width: 390px; max-height: 70vh; background: var(--bg-elevated); border-radius: 20px 20px 0 0; overflow-y: auto; padding: 20px; border-top: 1px solid var(--border-mid); }
.modal-sheet .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-mid); margin: 0 auto 16px; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal-field { margin-bottom: 16px; }
.modal-field label { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 4px; }
.modal-field input[type="range"] { width: 100%; accent-color: var(--accent-red); }
.modal-field .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); text-align: right; display: block; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; border: 1px solid var(--border-mid); background: var(--bg-overlay); color: var(--text-primary); }
.modal-actions button.save { background: var(--accent-red); color: #fff; border: none; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; background: var(--bg-overlay); color: var(--text-primary); border: 1px solid var(--border-mid); z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.error { border-color: rgba(239,68,68,0.4); color: var(--accent-red); }
.toast.success { border-color: rgba(34,197,94,0.4); color: var(--accent-green); }

@media (max-width: 420px) {
  .phone-frame { width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
}
</style>
</head>
<body>

<div class="phone-frame" id="app">
  <div class="status-bar">
    <span class="time" id="status-time">12:00</span>
    <span class="icons"><span id="conn-dot" class="status-dot"></span><span>VG</span></span>
  </div>

  <div class="conn-bar online" id="conn-bar">
    <span class="conn-dot"></span>
    <span id="conn-label">已连接 · visionguard.xgwnje.cn</span>
  </div>

  <div class="content" id="content">

    <!-- ALERT LIST -->
    <div class="page active" id="page-alerts">
      <div class="page-title">警报</div>
      <div class="section-header" id="header-today">今天</div>
      <div id="alerts-today"></div>
      <div class="section-header" id="header-yesterday">昨天</div>
      <div id="alerts-yesterday"></div>
      <div id="alerts-empty" class="empty-state" style="display:none">
        <div class="empty-icon">◉</div>
        <div class="empty-label">暂无报警记录</div>
      </div>
    </div>

    <!-- DEVICE LIST -->
    <div class="page" id="page-devices">
      <div class="page-title">在线设备</div>
      <div class="section-header">已连接</div>
      <div id="devices-online"></div>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="page-settings">
      <div class="page-title">设置</div>
      <div class="settings-group">
        <div class="settings-group-title">服务器连接</div>
        <div class="settings-row"><span class="label">连接状态</span><span class="value" id="settings-conn-state">● 已连接</span></div>
        <div class="settings-row"><span class="label">服务器</span><span class="value mono-block">visionguard.xgwnje.cn</span></div>
        <button class="settings-btn" onclick="simulateReconnect()">重新连接</button>
      </div>
      <div class="settings-group">
        <div class="settings-group-title">版本</div>
        <div class="settings-row"><span class="label">当前版本</span><span class="value mono-block" id="settings-version">v4.1.0</span></div>
        <button class="settings-btn primary" id="btn-check-update" onclick="simulateCheckUpdate()">检查更新</button>
      </div>
    </div>

    <!-- ALERT DETAIL -->
    <div class="page" id="page-detail">
      <button class="detail-back" onclick="navigateTo('alerts')"><span>&larr;</span> 返回</button>
      <div class="detail-header">
        <div class="detail-device" id="detail-device-name">客厅摄像头</div>
        <div class="detail-timestamp" id="detail-timestamp">06-05 14:32:18</div>
      </div>
      <div class="detail-screenshot">
        <div class="fake-scene" id="detail-scene">
          <div class="scene-figure"></div>
          <div class="scene-object"></div>
          <div class="detection-overlay" style="left:33%;top:28%;width:60px;height:80px;"><span class="det-label">person 94%</span></div>
          <div class="detection-overlay" style="left:18%;top:42%;width:36px;height:28px;"><span class="det-label">cell phone 87%</span></div>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">检测目标</div>
        <div id="detail-detections"></div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">链路耗时</div>
        <div id="detail-timings"></div>
      </div>
      <div style="height: 40px;"></div>
    </div>
  </div>

  <div class="tab-bar" id="tab-bar">
    <button class="tab active" data-page="alerts" onclick="navigateTo('alerts')">
      <span class="tab-icon">&#9633;</span><span>警报</span>
      <span class="tab-badge" id="tab-badge-alerts" style="display:none">0</span>
    </button>
    <button class="tab" data-page="devices" onclick="navigateTo('devices')">
      <span class="tab-icon">&#11039;</span><span>设备</span>
    </button>
    <button class="tab" data-page="settings" onclick="navigateTo('settings')">
      <span class="tab-icon">&#9678;</span><span>设置</span>
    </button>
  </div>

  <div class="modal-backdrop" id="config-modal">
    <div class="modal-sheet">
      <div class="handle"></div>
      <div class="modal-title" id="config-modal-title">设备配置</div>
      <div class="modal-field">
        <label>冷却时间 <span id="cooldown-val">30s</span></label>
        <input type="range" min="5" max="120" value="30" id="cooldown-slider">
        <span class="range-val">30s</span>
      </div>
      <div class="modal-field">
        <label>置信度阈值 <span id="conf-val">0.45</span></label>
        <input type="range" min="20" max="90" value="45" id="conf-slider">
        <span class="range-val">0.45</span>
      </div>
      <div class="modal-actions">
        <button onclick="closeConfigModal()">取消</button>
        <button class="save" onclick="saveConfig()">保存并下发</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// Mock data
var mockAlerts = [
  { id:'a1', deviceName:'客厅摄像头', deviceId:'win-01', timestamp: new Date(Date.now()-2*60000).toISOString(), detections:[{label:'person',confidence:0.94},{label:'cell phone',confidence:0.87}], severity:'critical', timings:{processMs:127,networkMs:218,serverMs:45}, screenshot:true },
  { id:'a2', deviceName:'仓库入口', deviceId:'win-02', timestamp: new Date(Date.now()-15*60000).toISOString(), detections:[{label:'person',confidence:0.88},{label:'backpack',confidence:0.72}], severity:'critical', timings:{processMs:98,networkMs:312,serverMs:52}, screenshot:true },
  { id:'a3', deviceName:'后院围墙', deviceId:'win-03', timestamp: new Date(Date.now()-45*60000).toISOString(), detections:[{label:'dog',confidence:0.65}], severity:'warning', timings:{processMs:112,networkMs:195,serverMs:40}, screenshot:false },
  { id:'a4', deviceName:'门口玄关', deviceId:'and-01', timestamp: new Date(Date.now()-2*3600000).toISOString(), detections:[{label:'person',confidence:0.91}], severity:'critical', timings:{processMs:145,networkMs:267,serverMs:48}, screenshot:true },
  { id:'a5', deviceName:'车库', deviceId:'and-02', timestamp: new Date(Date.now()-3*3600000).toISOString(), detections:[{label:'car',confidence:0.78}], severity:'info', timings:{processMs:89,networkMs:201,serverMs:38}, screenshot:false },
  { id:'a6', deviceName:'客厅摄像头', deviceId:'win-01', timestamp: new Date(Date.now()-25*3600000).toISOString(), detections:[{label:'person',confidence:0.96},{label:'chair',confidence:0.82}], severity:'critical', timings:{processMs:118,networkMs:234,serverMs:51}, screenshot:true },
  { id:'a7', deviceName:'前院车道', deviceId:'win-04', timestamp: new Date(Date.now()-28*3600000).toISOString(), detections:[{label:'car',confidence:0.83}], severity:'info', timings:{processMs:136,networkMs:198,serverMs:42}, screenshot:false },
  { id:'a8', deviceName:'后院围墙', deviceId:'win-03', timestamp: new Date(Date.now()-48*3600000).toISOString(), detections:[{label:'cat',confidence:0.55}], severity:'info', timings:{processMs:105,networkMs:221,serverMs:45}, screenshot:false }
];

var mockDevices = [
  { id:'win-01', name:'客厅摄像头', type:'WinForms', ip:'192.168.1.101', online:true, lastSeen:'2分钟前', conf:0.45, cooldown:30 },
  { id:'win-02', name:'仓库入口', type:'WinForms', ip:'192.168.1.102', online:true, lastSeen:'15分钟前', conf:0.50, cooldown:45 },
  { id:'and-01', name:'门口玄关', type:'Android Detector', ip:'192.168.1.201', online:true, lastSeen:'5分钟前', conf:0.40, cooldown:20 },
  { id:'win-03', name:'后院围墙', type:'WPF', ip:'192.168.1.103', online:false, lastSeen:'2小时前', conf:0.45, cooldown:30 },
  { id:'win-04', name:'前院车道', type:'WPF', ip:'192.168.1.104', online:false, lastSeen:'1天前', conf:0.50, cooldown:30 }
];

var cocoZh = { person:'人', 'cell phone':'手机', backpack:'背包', dog:'狗', car:'汽车', cat:'猫', chair:'椅子' };
function zh(l) { return cocoZh[l] || l; }

function pad2(n) { return String(n).padStart(2,'0'); }
function timeLabel(d) { var dt=new Date(d); return pad2(dt.getHours())+':'+pad2(dt.getMinutes())+':'+pad2(dt.getSeconds()); }
function dateLabel(d) { var dt=new Date(d); return pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
function isToday(d) { return new Date(d).toDateString() === new Date().toDateString(); }
function isYesterday(d) { var y=new Date(); y.setDate(y.getDate()-1); return new Date(d).toDateString() === y.toDateString(); }

function renderAlerts() {
  var today = mockAlerts.filter(function(a){return isToday(a.timestamp);});
  var yesterday = mockAlerts.filter(function(a){return isYesterday(a.timestamp);});
  function renderItems(items, cid) {
    document.getElementById(cid).innerHTML = items.map(function(a){
      return '<div class="alert-item" onclick="openDetail(''+a.id+'')">'+
        '<div class="severity-line '+a.severity+'"></div>'+
        '<div class="alert-body">'+
          '<div class="alert-device">'+a.deviceName+'</div>'+
          '<div class="alert-labels">'+a.detections.map(function(d){return '<span class="alert-label-tag">'+zh(d.label)+'&nbsp;'+Math.round(d.confidence*100)+'%</span>';}).join('')+'</div>'+
          '<div class="alert-time">'+timeLabel(a.timestamp)+'</div>'+
        '</div>'+
        '<span class="alert-arrow">&rsaquo;</span>'+
      '</div>';
    }).join('');
  }
  document.getElementById('header-today').style.display = today.length ? '' : 'none';
  document.getElementById('header-yesterday').style.display = yesterday.length ? '' : 'none';
  renderItems(today, 'alerts-today');
  renderItems(yesterday, 'alerts-yesterday');
  var empty = document.getElementById('alerts-empty');
  empty.style.display = mockAlerts.length===0 ? '' : 'none';
  var badge = document.getElementById('tab-badge-alerts');
  if (today.length>0) { badge.style.display=''; badge.textContent=today.length; } else { badge.style.display='none'; }
}

function renderDevices() {
  document.getElementById('devices-online').innerHTML = mockDevices.map(function(d){
    return '<div class="device-item">'+
      '<div class="device-status '+(d.online?'online':'offline')+'"></div>'+
      '<div class="device-info"><div class="device-name">'+d.name+'</div><div class="device-meta"><span>'+d.type+'</span><span>'+d.ip+'</span><span>'+d.lastSeen+'</span></div></div>'+
      '<div class="device-controls"><button class="ctrl-btn" onclick="openConfig(''+d.id+'')">配置</button><button class="ctrl-btn danger" onclick="simulateControl(''+d.id+'','pause')">暂停</button></div>'+
    '</div>';
  }).join('');
}

function openDetail(alertId) {
  var a = mockAlerts.find(function(x){return x.id===alertId;});
  if (!a) return;
  document.getElementById('detail-device-name').textContent = a.deviceName;
  document.getElementById('detail-timestamp').textContent = dateLabel(a.timestamp)+' '+timeLabel(a.timestamp);
  document.getElementById('detail-detections').innerHTML = a.detections.map(function(d){
    return '<div class="detection-row"><div class="detection-dot"></div><span class="detection-name">'+zh(d.label)+'</span><span class="detection-conf">'+Math.round(d.confidence*100)+'%</span></div>';
  }).join('') + (a.detections.length===0?'<span style="color:var(--text-muted);font-size:13px;">无检测结果</span>':'');
  var t = a.timings||{}, total = (t.processMs||0)+(t.networkMs||0)+(t.serverMs||0);
  document.getElementById('detail-timings').innerHTML =
    '<div class="timing-bar">'+
      '<div class="fill-local" style="left:0;width:'+Math.round((t.processMs||0)/total*100)+'%"></div>'+
      '<div class="fill-network" style="left:'+Math.round((t.processMs||0)/total*100)+'%;width:'+Math.round((t.networkMs||0)/total*100)+'%"></div>'+
      '<div class="fill-server" style="left:'+Math.round(((t.processMs||0)+(t.networkMs||0))/total*100)+'%;width:'+Math.round((t.serverMs||0)/total*100)+'%"></div>'+
    '</div>'+
    '<div class="timing-legend">'+
      '<div class="timing-legend-item"><span class="swatch swatch-local"></span>本地处理 '+(t.processMs||0)+'ms</div>'+
      '<div class="timing-legend-item"><span class="swatch swatch-network"></span>网络传输 '+(t.networkMs||0)+'ms</div>'+
      '<div class="timing-legend-item"><span class="swatch swatch-server"></span>服务器 '+(t.serverMs||0)+'ms</div>'+
    '</div>'+
    '<div style="margin-top:8px;font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);">端到端延迟 '+total+'ms</div>';
  var scene = document.getElementById('detail-scene');
  scene.style.display = a.screenshot ? '' : 'none';
  if (!a.screenshot && document.querySelector('.detail-screenshot .placeholder')) {
    // already has placeholder or add one
  }
  if (!a.screenshot) {
    var ss = document.querySelector('.detail-screenshot');
    if (!ss.querySelector('.placeholder')) {
      ss.innerHTML = '<div class="placeholder">[ 截图不可用 &middot; 设备离线 ]</div>';
    }
  } else {
    var ss2 = document.querySelector('.detail-screenshot');
    var p = ss2.querySelector('.placeholder');
    if (p) { ss2.innerHTML = '<div class="fake-scene" id="detail-scene"><div class="scene-figure"></div><div class="scene-object"></div><div class="detection-overlay" style="left:33%;top:28%;width:60px;height:80px;"><span class="det-label">person 94%</span></div><div class="detection-overlay" style="left:18%;top:42%;width:36px;height:28px;"><span class="det-label">cell phone 87%</span></div></div>'; }
  }
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-detail').classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
}

function navigateTo(page) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  var t = document.querySelector('[data-page="'+page+'"]');
  if (t) t.classList.add('active');
  // Restore screenshot view
  if (page==='alerts') {
    var ss = document.querySelector('.detail-screenshot');
    var p = ss.querySelector('.placeholder');
    if (p) { ss.innerHTML = '<div class="fake-scene" id="detail-scene"><div class="scene-figure"></div><div class="scene-object"></div><div class="detection-overlay" style="left:33%;top:28%;width:60px;height:80px;"><span class="det-label">person 94%</span></div><div class="detection-overlay" style="left:18%;top:42%;width:36px;height:28px;"><span class="det-label">cell phone 87%</span></div></div>'; }
  }
}

function openConfig(deviceId) {
  var d = mockDevices.find(function(x){return x.id===deviceId;});
  if (!d) return;
  document.getElementById('config-modal-title').textContent = d.name+' 配置';
  document.getElementById('cooldown-slider').value = d.cooldown;
  document.getElementById('cooldown-slider').nextElementSibling.textContent = d.cooldown+'s';
  document.getElementById('conf-slider').value = Math.round(d.conf*100);
  document.getElementById('conf-slider').nextElementSibling.textContent = d.conf.toFixed(2);
  document.getElementById('config-modal').classList.add('show');
  document.getElementById('config-modal').dataset.deviceId = deviceId;
}

function closeConfigModal() { document.getElementById('config-modal').classList.remove('show'); }

function saveConfig() { closeConfigModal(); showToast('配置已下发', 'success'); }

function simulateControl(deviceId, action) {
  var d = mockDevices.find(function(x){return x.id===deviceId;});
  showToast(d.name+' '+(action==='pause'?'已暂停':'已恢复'), 'success');
}

function simulateReconnect() {
  var bar = document.getElementById('conn-bar');
  bar.classList.remove('online'); bar.classList.add('offline');
  document.getElementById('conn-label').textContent = '重连中...';
  document.getElementById('conn-dot').style.background = 'var(--accent-amber)';
  document.getElementById('settings-conn-state').innerHTML = '&#9678; 连接中...';
  setTimeout(function(){
    bar.classList.remove('offline'); bar.classList.add('online');
    document.getElementById('conn-label').textContent = '已连接 · visionguard.xgwnje.cn';
    document.getElementById('conn-dot').style.background = 'var(--accent-green)';
    document.getElementById('settings-conn-state').innerHTML = '● 已连接';
    showToast('已重新连接', 'success');
  }, 1500);
}

function simulateCheckUpdate() {
  var btn = document.getElementById('btn-check-update');
  btn.textContent = '检查中...'; btn.disabled = true;
  setTimeout(function(){
    btn.textContent = '已是最新版本'; btn.classList.remove('primary'); btn.disabled = false;
    showToast('v4.1.0 已是最新版本');
    setTimeout(function(){ btn.textContent = '检查更新'; btn.classList.add('primary'); }, 2000);
  }, 1200);
}

function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast '+(type||'')+' show';
  clearTimeout(el._timeout);
  el._timeout = setTimeout(function(){el.classList.remove('show');}, 2000);
}

function updateClock() {
  var now = new Date();
  document.getElementById('status-time').textContent = pad2(now.getHours())+':'+pad2(now.getMinutes());
}
updateClock(); setInterval(updateClock, 30000);

renderAlerts(); renderDevices();

document.getElementById('config-modal').addEventListener('click', function(e){if(e.target===this)closeConfigModal();});

// Range slider live update
document.getElementById('cooldown-slider').addEventListener('input', function(){
  this.nextElementSibling.textContent = this.value+'s';
  document.getElementById('cooldown-val').textContent = this.value+'s';
});
document.getElementById('conf-slider').addEventListener('input', function(){
  var v = (this.value/100).toFixed(2);
  this.nextElementSibling.textContent = v;
  document.getElementById('conf-val').textContent = v;
});
</script>
</body>
</html>
