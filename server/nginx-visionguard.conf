# VisionGuard Nginx 反向代理配置
# 域名: xgwnje.cn
# 用途: HTTPS 终止 + WebSocket 升级 + 反向代理到 localhost:3000

server {
    listen 80;
    server_name xgwnje.cn www.xgwnje.cn;

    # Certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xgwnje.cn www.xgwnje.cn;

    # SSL 证书 (certbot 自动填充)
    ssl_certificate     /etc/letsencrypt/live/xgwnje.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xgwnje.cn/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 请求体大小限制 (截图上传)
    client_max_body_size 3m;

    # 日志
    access_log /var/log/nginx/xgwnje-access.log;
    error_log  /var/log/nginx/xgwnje-error.log;

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # 长连接不超时
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
